',x:880,y:415,parent:'SYS-06',rows:[['SUB-14','Persist collected samples'],['SUB-15','Restore retained samples']]}];

function positionGroups(){

  const children=groups.filter(g=>g.parent&&expanded.has(g.parent)&&parent.rows.some(r=>r[0]===g.parent));
  const childHeight=children.reduce((sum,g)=>sum+groupHeight(g),0)+Math.max(0,children.length-1)*gap;

  parent.x=400;parent.y=cursor+(blockHeight-groupHeight(parent))/2;
  let childY=cursor+(blockHeight-childHeight)/2;
  for(const child of children){child.x=800;child.y=childY;childY+=groupHeight(child)+gap}
  cursor+=blockHeight+52;

}
function render(relayout=false){if(relayout)positionGroups();world.querySelectorAll('.group').forEach(e=>e.remove());buttons.clear();const visible=visibleGroups();const height=Math.max(660,...visible.map(g=>g.y+groupHeight(g)+24));world.style.height=height+'px';svg.style.height=height+'px';visible.forEach(g=>{const box=document.createElement('section');box.className='group';box.dataset.group=g.id;box.style.left=g.x+'px';box.style.top=g.y+'px';const head=document.createElement('header');head.textContent=g.title;box.append(head);g.rows.forEach(([id,title])=>{

 if(g.id!=='stakeholder'){const port=document.createElement('span');port.className='port in';row.append(port)}const port=document.createElement('span');port.className='port';row.append(port);box.append(row);buttons.set(id,row)
 });world.append(box);head.onpointerdown=e=>{e.preventDefault();e.stopPropagation();head.setPointerCapture(e.pointerId);const sx=e.clientX,sy=e.clientY,gx=g.x,gy=g.y;head.onpointermove=ev=>{g.x=Math.max(0,gx+(ev.clientX-sx)/scale);g.y=Math.max(0,gy+(ev.clientY-sy)/scale);box.style.left=g.x+'px';box.style.top=g.y+'px';draw()};head.onpointerup=()=>{head.onpointermove=null}}});requestAnimationFrame(draw)}
function draw(){svg.replaceChildren();const edges=[...baseEdges,...groups.filter(g=>expanded.has(g.parent)).flatMap(g=>g.rows.map(r=>[g.parent,r[0]]))];for(const [a,b]of edges){const from=buttons.get(a),to=buttons.get(b);if(!from||!to)continue;const ar=from.getBoundingClientRect(),br=to.getBoundingClientRect(),wr=world.getBoundingClientRect();const x1=(ar.right-wr.left)/scale,y1=(ar.top+ar.height/2-wr.top)/scale,x2=(br.left-wr.left)/scale,y2=(br.top+br.height/2-wr.top)/scale;const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M${x1},${y1} C${x1+90},${y1} ${x2-90},${y2} ${x2},${y2}`);if(a===selected||b===selected||expanded.has(a))p.classList.add('highlight');svg.append(p)}}
const descriptions={

};

function select(id){
 selected=id;currentRequirement=id;render();const group=groups.find(g=>g.rows.some(r=>r[0]===id)),row=group.rows.find(r=>r[0]===id);
 const panel=document.getElementById('inspector');panel.hidden=false;document.getElementById('req').classList.add('details-open');
 document.getElementById('detailId').textContent=id;document.getElementById('detailTitle').textContent=row[1];document.getElementById('detailMeta').textContent='Draft · revision 3';document.getElementById('bodyLabel').textContent='Requirement';document.getElementById('detailBody').textContent=requirementText(id);document.getElementById('detailGroup').textContent=group.title;document.getElementById('artifactSections').hidden=false;document.getElementById('focusRequirement').hidden=false;
 const links=document.getElementById('detailLinks');links.replaceChildren();const related=new Set(allEdges().filter(e=>e.includes(id)).map(e=>e[0]===id?e[1]:e[0]));for(const other of related){const data=requirementRows.find(r=>r[0]===other);const link=document.createElement('button');link.className='link';link.textContent=data[1];link.onclick=()=>select(other);links.append(link)}
 renderRevisions(id);
 const target=document.getElementById('detailVerification');target.replaceChildren();for(const artifact of artifactsFor(id).filter(a=>a.type==='Verification')){const button=document.createElement('button');button.className='artifact-link';button.textContent=artifact.title;const small=document.createElement('small');small.textContent=artifact.meta;button.append(small);button.onclick=()=>inspectArtifact(artifact);target.append(button)}

}
const openRevisions=new Map();

 return [{revision:3,state:'Current · Draft',text:current,review:artifactsFor(id)[0]},{revision:2,state:'Superseded',text:earlier[0],review:{id:'REV-'+id+'-r2',title:'Clarify unavailable-data behavior',type:'Review',meta:'Changes requested · requirement revision 2',body:'Revision 2 does not define what the user sees when the reading is unavailable. Specify that observable behavior before acceptance.',requirement:id,requirementRevision:2}},{revision:1,state:'Superseded',text:earlier[1],review:{id:'REV-'+id+'-r1',title:'Make the expected result explicit',type:'Review',meta:'Changes requested · requirement revision 1',body:'Revision 1 states the goal without enough detail to verify its result. Define the displayed information and its units.',requirement:id,requirementRevision:1}}];
